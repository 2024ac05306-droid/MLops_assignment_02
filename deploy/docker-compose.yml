version: '3.8'

services:
  mlops-api:
    image: ghcr.io/2024ac05306-droid/mlops_assignment_02:main
    container_name: mlops-cat-dog-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mlops-network

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mlops-network
    depends_on:
      - mlops-api

volumes:
  prometheus-data:

networks:
  mlops-network:
    driver: bridge
