apiVersion: v1
kind: Service
metadata:
  name: mlops-api
  namespace: default
  labels:
    app: mlops-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: LoadBalancer
  selector:
    app: mlops-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: mlops-api-internal
  namespace: default
  labels:
    app: mlops-api
spec:
  type: ClusterIP
  selector:
    app: mlops-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
